<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bomboclat Flow</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <!-- ============ SIDEBAR ============ -->
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <line x1="3"  y1="12" x2="3"  y2="12" />
            <line x1="7"  y1="8"  x2="7"  y2="16" />
            <line x1="11" y1="4"  x2="11" y2="20" />
            <line x1="15" y1="9"  x2="15" y2="15" />
            <line x1="19" y1="6"  x2="19" y2="18" />
          </svg>
        </span>
        <span class="brand-name">Bomboclat Flow</span>
        <span class="pill pill-local">Local</span>
      </div>

      <nav class="nav" aria-label="Primary">
        <button class="nav-item is-active" data-view="home" type="button">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7" rx="1.5" />
            <rect x="14" y="3" width="7" height="7" rx="1.5" />
            <rect x="3" y="14" width="7" height="7" rx="1.5" />
            <rect x="14" y="14" width="7" height="7" rx="1.5" />
          </svg>
          <span>Home</span>
        </button>
        <button class="nav-item" data-view="insights" type="button">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 20V4" />
            <path d="M4 20h16" />
            <rect x="7" y="12" width="3" height="5" rx="0.8" />
            <rect x="12" y="8" width="3" height="9" rx="0.8" />
            <rect x="17" y="5" width="3" height="12" rx="0.8" />
          </svg>
          <span>Insights</span>
        </button>
        <button class="nav-item" data-view="dictionary" type="button">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15.5H6.5A2.5 2.5 0 0 0 4 21z" />
            <path d="M4 18.5A2.5 2.5 0 0 1 6.5 16H20" />
          </svg>
          <span>Dictionary</span>
        </button>
      </nav>

      <div class="sidebar-foot">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="5" y="11" width="14" height="9" rx="2" />
          <path d="M8 11V8a4 4 0 0 1 8 0v3" />
        </svg>
        <span>All data stays on this Mac</span>
      </div>
    </aside>

    <!-- ============ CONTENT ============ -->
    <main class="content">
      <div class="content-inner">
        <section id="view-home" class="view is-active" aria-hidden="false"></section>
        <section id="view-insights" class="view" aria-hidden="true"></section>
        <section id="view-dictionary" class="view" aria-hidden="true"></section>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
