<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bomboclat Flow</title>
  <link rel="icon" href="favicon.svg" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <!-- ============ SIDEBAR ============ -->
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="100 100 824 824" width="24" height="24" xmlns="http://www.w3.org/2000/svg">
            <rect x="100" y="100" width="824" height="824" rx="185" fill="#FFF3E4"/>
            <g transform="translate(512,650.5) scale(2.6)">
              <g transform="translate(0,-74)">
                <g fill="#1F7A52">
                  <path d="M0 0 C 6 -34 40 -88 80 -66 C 46 -50 16 -22 0 0 Z"/>
                  <path transform="scale(-1,1)" d="M0 0 C 6 -34 40 -88 80 -66 C 46 -50 16 -22 0 0 Z"/>
                  <path d="M0 0 C -9 -36 -9 -74 14 -102 C 4 -70 4 -34 0 0 Z"/>
                </g>
                <g fill="#3FAE7B">
                  <path d="M0 0 C 16 -38 58 -52 106 -14 C 60 -24 26 -8 0 0 Z"/>
                  <path transform="scale(-1,1)" d="M0 0 C 16 -38 58 -52 106 -14 C 60 -24 26 -8 0 0 Z"/>
                </g>
              </g>
              <g fill="#22313F">
                <rect x="-24" y="-80" width="48" height="94" rx="24"/>
                <rect x="-5.5" y="32" width="11" height="30" rx="5.5"/>
                <rect x="-30" y="58" width="60" height="11.5" rx="5.75"/>
              </g>
              <path d="M-42 -8 A42 42 0 0 0 42 -8" fill="none" stroke="#22313F" stroke-width="11.5" stroke-linecap="round"/>
              <g fill="#FFF3E4">
                <rect x="-12" y="-55" width="24" height="5.5" rx="2.75"/>
                <rect x="-12" y="-43" width="24" height="5.5" rx="2.75"/>
              </g>
            </g>
          </svg>
        </span>
        <span class="brand-name">Bomboclat Flow</span>
        <span class="pill pill-local">Local</span>
      </div>

      <nav class="nav" aria-label="Primary">
        <button class="nav-item is-active" data-view="home" type="button">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7" rx="1.5" />
            <rect x="14" y="3" width="7" height="7" rx="1.5" />
            <rect x="3" y="14" width="7" height="7" rx="1.5" />
            <rect x="14" y="14" width="7" height="7" rx="1.5" />
          </svg>
          <span>Home</span>
        </button>
        <button class="nav-item" data-view="insights" type="button">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 20V4" />
            <path d="M4 20h16" />
            <rect x="7" y="12" width="3" height="5" rx="0.8" />
            <rect x="12" y="8" width="3" height="9" rx="0.8" />
            <rect x="17" y="5" width="3" height="12" rx="0.8" />
          </svg>
          <span>Insights</span>
        </button>
        <button class="nav-item" data-view="dictionary" type="button">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15.5H6.5A2.5 2.5 0 0 0 4 21z" />
            <path d="M4 18.5A2.5 2.5 0 0 1 6.5 16H20" />
          </svg>
          <span>Dictionary</span>
        </button>
      </nav>

      <div class="sidebar-foot">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="5" y="11" width="14" height="9" rx="2" />
          <path d="M8 11V8a4 4 0 0 1 8 0v3" />
        </svg>
        <span>All data stays on this Mac</span>
      </div>
    </aside>

    <!-- ============ CONTENT ============ -->
    <main class="content">
      <div class="content-inner">
        <section id="view-home" class="view is-active" aria-hidden="false"></section>
        <section id="view-insights" class="view" aria-hidden="true"></section>
        <section id="view-dictionary" class="view" aria-hidden="true"></section>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
