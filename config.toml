# whisper-flow configuration
# Hold the hotkey, speak, release — cleaned-up text is pasted at your cursor.

[hotkey]
# Which key to hold while talking. Options: "fn" (the 🌐/Fn key, bottom-left,
# default), "alt_r" (Right-Option), "cmd_r" (Right-Command),
# "ctrl_r" (Right-Control), "f13".
#
# Note on "fn": macOS assigns the Fn/🌐 key to the emoji picker or input-source
# switch by default, which can interfere with holding it. Disable that under
# System Settings → Keyboard → "Press 🌐 key to" → "Do Nothing".
key = "fn"

[audio]
# Recordings shorter than this are discarded (accidental taps).
min_duration_s = 0.3
# Recordings are force-stopped after this many seconds.
max_duration_s = 120

[stt]
# "whisper" (recommended, better with mixed-language utterances, requires:
# pip install mlx-whisper) or "parakeet" (faster, but single-language-per-utterance).
engine = "whisper"
# parakeet_model = "mlx-community/parakeet-tdt-0.6b-v3"
whisper_model = "mlx-community/whisper-large-v3-turbo"

[cleanup]
# LLM cleanup of the raw transcript (removes filler words, fixes punctuation).
enabled = true

# Which LLM provider to use: "openrouter" (or any OpenAI-compatible endpoint)
# or "anthropic" (Claude via the official SDK).
provider = "openrouter"

# The API key is read from the Keychain (never stored in plain text). Store it:
#   OpenRouter:  security add-generic-password -s whisper-flow -a openrouter -w YOUR_KEY
#   Anthropic:   security add-generic-password -s whisper-flow -a anthropic  -w YOUR_KEY
# Env vars OPENROUTER_API_KEY / ANTHROPIC_API_KEY also work and take precedence.

# Base URL for OpenAI-compatible providers (ignored when provider = "anthropic").
base_url = "https://openrouter.ai/api/v1"

# The model to use. Must match the provider's model ID.
#   OpenRouter (price/quality sweet spot for dictation cleanup, ~10x cheaper
#   than Claude Haiku, strong German): "google/gemini-2.5-flash-lite"
#   Newer, slightly better quality:     "google/gemini-3.1-flash-lite"
#   Anthropic direct:                   "claude-haiku-4-5"
model = "google/gemini-2.5-flash-lite"

# Skip cleanup for transcripts shorter than this many words.
min_words = 4
# Give up on cleanup after this many seconds and paste the raw transcript.
timeout_s = 5.0

[insert]
# "paste" (clipboard + Cmd+V, works almost everywhere) or "type" (simulated
# keystrokes, slower but works in apps that block programmatic paste).
mode = "paste"
